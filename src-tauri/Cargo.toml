[package]
name = "localchesspgn"
version = "0.2.0"
description = "LocalChessPGN — leitor e editor de PGN, com tabuleiro e navegação de variantes, 100% offline"
authors = ["Taylor"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Anon5T4R/LocalChessPGN"

[lib]
# O sufixo `_lib` evita conflito entre o nome da lib e o do binário no Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "localchesspgn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.30"
pgn-reader = "0.29"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
